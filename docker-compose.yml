services:
  web-yt-dlp:
    build: .
    container_name: web-yt-dlp
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - TMP_DIR=/tmp/yt-dlp-workdir
      - AUTO_UPDATE_YTDLP=true
      - XDG_CACHE_HOME=/tmp/yt-dlp-workdir
      # AUTH_TOKEN is host-specific — set it in docker-compose.override.yml
      # (see docker-compose.override.yml.example). Do NOT commit real tokens.
    restart: unless-stopped
    volumes:
      # Writable temp directory for downloads
      - yt-dlp-temp:/tmp/yt-dlp-workdir
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  yt-dlp-temp:
